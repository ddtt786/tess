<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>painter — 벡터 · 비트맵 모던 스튜디오</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .demo-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
      height: 48px;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
      font-size: 12px;
    }

    .demo-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .demo-brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: #0f172a;
      color: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
    }

    .demo-bar .sub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 99px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 11px;
      font-weight: 500;
    }

    .demo-bar .spacer {
      flex: 1;
    }

    .demo-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-bar button {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #ffffff;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 120ms ease;
    }

    .demo-bar button:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #0f172a;
    }

    .demo-bar button.primary {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      font-weight: 600;
    }

    .demo-bar button.primary:hover {
      background: #1e293b;
      border-color: #1e293b;
    }

    #app {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
    }
  </style>
</head>

<body>
  <div class="demo-bar">
    <div class="demo-brand">
      <span class="demo-brand-badge">P</span>
      <span>painter</span>
    </div>
    <span class="sub">perfect-freehand · SVG.js · clipper2</span>
    <span class="spacer"></span>
    <div class="demo-actions">
      <button id="sample">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
        예제 그리기
      </button>
      <button id="export" class="primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        내보내기
      </button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
